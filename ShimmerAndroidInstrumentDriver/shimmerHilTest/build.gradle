// Hardware-in-the-loop (HIL) tests of the Android API on a USB-attached phone against real
// Shimmer3 / Shimmer3R units. The tests are in src/androidTest; this app only hosts them. Run them
// with tools/hil/run-android-hil.ps1 (see tools/hil/README.md).
//
// Which Android API is tested:
//   default                          the ShimmerAndroidInstrumentDriver source in this checkout
//   -PandroidApiVersion=3.2.10_beta  the published .aar, as a customer app gets it
// Which driver: -PdriverVersion, read by the root build.gradle like every other module.
apply plugin: 'com.android.application'

def androidApiVersion = findProperty('androidApiVersion')

android {
    namespace 'com.shimmerresearch.hiltest'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.shimmerresearch.hiltest"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    if (androidApiVersion) {
        implementation(group: 'com.shimmerresearch', name: 'shimmerandroidinstrumentdriver', version: androidApiVersion, ext: 'aar')
    } else {
        implementation project(':ShimmerAndroidInstrumentDriver')
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'junit:junit:4.13.2'
}
